name: Fix Engine Indentation

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fix engine.py
        run: python3 scripts/fixer.py

      - name: Commit fixed engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add core/engine.py
          git diff --cached --quiet && echo "No changes" || git commit -m "fix: resolve engine.py IndentationError"
          git push
