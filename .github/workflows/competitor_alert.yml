name: Competitor Alert Scan

# Manual trigger only — scheduled cron intentionally omitted. Add one once
# the email format and run cadence are agreed with Mark.
on:
  workflow_dispatch:
    inputs:
      weeks:
        description: 'Weeks of new applications to scan (default 1)'
        required: false
        default: '1'

concurrency:
  group: maplanning-competitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  competitor-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run competitor alert scan
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          OPENAI_API_KEY:           ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_MAPS_API_KEY:      ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GMAIL_FROM:               ${{ secrets.GMAIL_FROM }}
          GMAIL_APP_PASSWORD:       ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO_MAPLANNING:      ${{ secrets.GMAIL_TO_MAPLANNING }}
          MAX_RUNTIME_HOURS:        "1.8"
          SKIP_GEO_BLOCKED:         "1"
        run: |
          WEEKS="${{ github.event.inputs.weeks || '1' }}"
          python core/engine.py --weeks "$WEEKS" --mode applications
