name: MASTERFILE — Weekly Scraper

on:
  schedule:
    # Monday 07:00 UTC (08:00 Spain winter, 09:00 summer)
    # Offset 1hr from Masterfile run (06:00) so they don't compete for resources
    - cron: '0 7 * * 1'

  workflow_dispatch:
    inputs:
      weeks:
        description: 'Weeks to scrape back (2 = normal weekly, 12 = first full backfill)'
        required: false
        default: '2'

jobs:
  scrape_and_distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Master Scraper
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python core/engine.py --client master.json --weeks 1

      - name: Run Distributor
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python core/distribute_leads.py
