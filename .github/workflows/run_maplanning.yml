name: MAPlanning — Weekly Scraper

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      weeks:
        description: 'Weeks to scrape back (2 = weekly, 12 = full backfill)'
        required: false
        default: '2'

jobs:
  # ── Four parallel scrape jobs, each handling ~30 councils ──────────────────
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # 3h per batch — well within the 6h limit
    strategy:
      fail-fast: false      # if one batch fails, the others keep running
      matrix:
        batch: ["1/4", "2/4", "3/4", "4/4"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper — batch ${{ matrix.batch }}
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GMAIL_FROM:               ${{ secrets.GMAIL_FROM }}
          GMAIL_APP_PASSWORD:       ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO_MAPLANNING:      ${{ secrets.GMAIL_TO_MAPLANNING }}
          SCRAPE_BATCH:             ${{ matrix.batch }}
        run: |
          WEEKS=${{ github.event.inputs.weeks || '2' }}
          python core/engine.py --client clients/maplanning.json --weeks $WEEKS --batch ${{ matrix.batch }} --no-email

  # ── Single notify job that runs AFTER all four batches complete ────────────
  notify:
    runs-on: ubuntu-latest
    needs: scrape           # only runs when all 4 scrape jobs have finished
    if: always()            # runs even if some batches had errors

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send consolidated email digest
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GMAIL_FROM:               ${{ secrets.GMAIL_FROM }}
          GMAIL_APP_PASSWORD:       ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO_MAPLANNING:      ${{ secrets.GMAIL_TO_MAPLANNING }}
        run: |
          python core/engine.py --client clients/maplanning.json --weeks 0 --email-only
