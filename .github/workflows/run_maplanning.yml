name: MAPlanning — Weekly Scraper

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      weeks:
        description: 'Weeks to scrape back (2 = weekly, 12 = full backfill)'
        required: false
        default: '2'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        batch: ["1/4", "2/4", "3/4", "4/4"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MAPlanning scraper — batch ${{ matrix.batch }}
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GMAIL_FROM:               ${{ secrets.GMAIL_FROM }}
          GMAIL_APP_PASSWORD:       ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO_MAPLANNING:      ${{ secrets.GMAIL_TO_MAPLANNING }}
          SCRAPE_BATCH:             ${{ matrix.batch }}
          # Stop scraping ~10 min before the 180-min job timeout so the engine
          # can flush remaining leads and send the email digest. Without this,
          # the engine's default 5.5h budget runs until GitHub force-kills it
          # — which is why the job used to fail with no traceback.
          MAX_RUNTIME_HOURS:        "2.8"
          # ~25 of the ~150 UK council Idox portals reject GitHub's US-routed
          # IPs, burning 1-3 min each on timeouts. Skip them here; run manually
          # from Colab (UK IP) when full coverage is needed.
          SKIP_GEO_BLOCKED:         "1"
        run: |
          WEEKS="${{ github.event.inputs.weeks || '2' }}"
          python core/engine.py --weeks "$WEEKS"
