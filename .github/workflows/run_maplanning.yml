name: MAPlanning — Weekly Scraper

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      weeks:
        description: 'Weeks to scrape back (2 = weekly, 12 = full backfill)'
        required: false
        default: '2'

concurrency:
  group: maplanning-scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    # Pinned: 'ubuntu-latest' moves to Ubuntu 26 on 19 Oct 2026 (the notice in
    # your run). Pinning avoids a surprise breakage mid-campaign.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        batch: ["1/4", "2/4", "3/4", "4/4"]

    steps:
      # v5 / v6 run natively on Node 24 — clears the Node 20 deprecation warnings.
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          # tesseract-ocr lets the engine read scanned decision notices
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
          pip install -r requirements.txt

      - name: Run MAPlanning scraper — batch ${{ matrix.batch }}
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GMAIL_FROM:               ${{ secrets.GMAIL_FROM }}
          GMAIL_APP_PASSWORD:       ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO_MAPLANNING:      ${{ secrets.GMAIL_TO_MAPLANNING }}
          OPENAI_API_KEY:           ${{ secrets.OPENAI_API_KEY }}
          SCRAPE_BATCH:             ${{ matrix.batch }}
          MAX_RUNTIME_HOURS:        "2.8"
          SKIP_GEO_BLOCKED:         "1"
        run: |
          WEEKS="${{ github.event.inputs.weeks || '2' }}"
          python core/engine.py --weeks "$WEEKS"
